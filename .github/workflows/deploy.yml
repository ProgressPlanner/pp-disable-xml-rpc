name: Publish GitHub release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: Package and release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate version and prepare release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a release tag in vMAJOR.MINOR.PATCH format." >&2
            exit 1
          fi
          VERSION="${RELEASE_TAG#v}"
          test "$VERSION" = "$(awk '/^[[:space:]]*\* Version:/ { print $3; exit }' pp-disable-xml-rpc.php)"
          test "$VERSION" = "$(awk '/^Stable tag:/ { print $3; exit }' readme.txt)"
          awk -v version="$VERSION" '
            $0 == "== Changelog ==" { changelog = 1; next }
            changelog && $0 == "= " version " =" { notes = 1; next }
            notes && /^=/ { exit }
            notes { print }
          ' readme.txt > "$RUNNER_TEMP/release-notes.md"
          grep -q '^\* ' "$RUNNER_TEMP/release-notes.md"
      - name: Build installable plugin ZIP
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/package/pp-disable-xml-rpc"
          rsync -a --exclude-from=.distignore ./ "$RUNNER_TEMP/package/pp-disable-xml-rpc/"
          cd "$RUNNER_TEMP/package"
          zip -qr "$RUNNER_TEMP/pp-disable-xml-rpc.zip" pp-disable-xml-rpc
          unzip -t "$RUNNER_TEMP/pp-disable-xml-rpc.zip"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP/pp-disable-xml-rpc.zip" \
            --verify-tag --title "Release $RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
